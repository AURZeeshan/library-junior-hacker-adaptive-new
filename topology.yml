name: windows-linux-basic-lab

hosts:
  - name: windows-host
    base_box:
      image: windows-19
      mgmt_user: Administrator
      mgmt_protocol: winrm
    flavor: standard.small

  - name: linux-host
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    flavor: standard.small

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    flavor: standard.small

networks:
  - name: lab-net
    cidr: 10.10.10.0/24
    accessible_by_user: true

net_mappings:
  - host: windows-host
    network: lab-net
    ip: 10.10.10.10

  - host: linux-host
    network: lab-net
    ip: 10.10.10.20

router_mappings:
  - router: router
    network: lab-net
    ip: 10.10.10.1

groups: []
